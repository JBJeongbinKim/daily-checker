name: Refresh Mercor jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Skip non-6am Eastern run
        id: gate
        run: |
          EASTERN_HOUR=$(TZ=America/New_York date +%H)
          if [ "$EASTERN_HOUR" != "06" ]; then
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            echo "Skipping because current Eastern hour is $EASTERN_HOUR"
          else
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh Mercor snapshot
        if: steps.gate.outputs.run_refresh == 'true'
        id: refresh
        continue-on-error: true
        run: node scripts/refresh-mercor.mjs

      - name: Commit updated Mercor data
        if: steps.gate.outputs.run_refresh == 'true'
        run: |
          if git diff --quiet -- data/mercor-jobs.json; then
            echo "No Mercor data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mercor-jobs.json
          git commit -m "Refresh Mercor jobs"
          git push

      - name: Fail workflow when refresh failed
        if: steps.gate.outputs.run_refresh == 'true' && steps.refresh.outcome == 'failure'
        run: exit 1
