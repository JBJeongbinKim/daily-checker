name: Refresh jackpot history

on:
  workflow_dispatch:
  schedule:
    - cron: "10 10 * * *"
    - cron: "10 11 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh official jackpot snapshot
        run: node scripts/refresh-jackpots.mjs

      - name: Commit updated history
        run: |
          if git diff --quiet -- data/jackpot-history.json; then
            echo "No history changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jackpot-history.json
          git commit -m "Refresh jackpot history"
          git push
